name: Public safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile public upload helpers
        run: python -m py_compile scripts/upload_to_youtube.py scripts/youtube_bulk_scheduler.py

      - name: Verify direct upload defaults to dry-run
        run: python scripts/upload_to_youtube.py

      - name: Run public safety tests
        run: python -m pytest tests/test_trinity_public_safety.py -q
